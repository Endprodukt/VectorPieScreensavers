; The screensaver's package manifest (vendor/VectorPie/sdk/docs/07-packages.md).
; kind = screensaver: vp-pack makes a .vps, installed in
; SETTINGS -> SCREENSAVERS -> INSTALL, chosen in SETTINGS -> SCREENSAVERS -> SELECT.
id           = saver_constellations
name         = Constellations
manufacturer = Other
executable   = saver_constellations
version      = 0.1.2
sdk          = 1.1
author       = VectorPie Screensaver
description  = A slow tour of the real night sky, constellation by constellation
kind         = screensaver

[dvg]                            ; the USB-DVG
frame_hz     = 40                ; frames a second
[beamforge]
frame_hz     = 50
